[package]
name = "corim-profile-intel"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Intel CoRIM profile (draft-cds-rats-intel-corim-profile) plug-in for the `corim` crate. Registers the Intel profile identifier and renders Intel-defined measurement-values-map extension keys in diagnose output."
license = "MIT"
authors = ["Microsoft"]
repository = "https://github.com/Azure/corim"
keywords = ["corim", "intel", "sgx", "tdx", "attestation"]
categories = ["encoding", "authentication", "cryptography"]
readme = "README.md"

[features]
default = ["std"]
std = ["corim/std"]

[dependencies]
corim = { path = "../corim", version = "0.1.1", default-features = false }
