name: CI

on:
  push:
    branches: [main, staging, release/v0.1.x]
  pull_request:
    branches: [main, release/v0.1.x]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ['1.85.0', stable, nightly]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (workspace, all features)
        run: cargo build --workspace --all-features --locked

      - name: Test (workspace, all features)
        run: cargo test --workspace --all-features --locked

      # Library-only no_std build. corim-cli requires std, so scope to -p corim.
      - name: Build (corim, no-default-features, no_std + alloc)
        run: cargo build -p corim --no-default-features --locked

      - name: Build (corim, no-default-features + profile-intel)
        run: cargo build -p corim --no-default-features --features profile-intel --locked

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test release packaging and publishing without uploads
        run: |
          bash scripts/tests/publish-crate-tests.sh
          bash scripts/tests/release-packaging-tests.sh

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}

      - name: Clippy (workspace, all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Clippy (corim, no-default-features)
        run: cargo clippy -p corim --lib --no-default-features --locked -- -D warnings

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build docs
        run: cargo doc --workspace --all-features --locked --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  # --------------------------------------------------------------------------
  # Code coverage gate
  # --------------------------------------------------------------------------
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests and check coverage threshold
        run: |
          cargo llvm-cov --workspace --features json \
            --ignore-filename-regex '(corim-cli/|corim-macros/|src/lib\.rs$)' \
            --fail-under-lines 70
