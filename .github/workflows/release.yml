name: Release

# Publishes corim-macros and corim to crates.io when a tag matching v*
# is pushed. Uses crates.io Trusted Publishing (OIDC) — no API token in
# repo secrets is required. The corresponding "Trusted Publisher" entries
# must be configured at:
#   https://crates.io/crates/corim-macros/settings
#   https://crates.io/crates/corim/settings
# with:
#   Repository owner:    Azure
#   Repository name:     corim
#   Workflow filename:   release.yml
#   Environment name:    crates-io
#
# Release runbook:
#   1. Bump version in workspace + per-crate Cargo.toml; update CHANGELOG.
#   2. Merge to main.
#   3. git tag v0.X.Y && git push origin v0.X.Y
#   4. Approve the `crates-io` environment deployment in the Actions UI.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write   # Required for crates.io Trusted Publishing (OIDC).

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.99.0
  CARGO_TARGET_DIR: target/release-build

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Public release, not a rolling stable alias or a vendor toolchain.
      # Cargo 1.99 supports stable `cargo package --workspace`.
      - name: Install Rust 1.99.0
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy
          rustc --version --verbose
          cargo --version --verbose

      - name: Cache cargo registry & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release-build
          key: ${{ runner.os }}-cargo-release-1.99.0-${{ hashFiles('**/Cargo.lock') }}

      # Sanity: tag must match versions in Cargo.toml.
      - name: Verify tag matches crate versions
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          corim_ver=$(grep -m1 '^version = ' corim/Cargo.toml | cut -d'"' -f2)
          macros_ver=$(grep -m1 '^version = ' corim-macros/Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag corim=$corim_ver corim-macros=$macros_ver"
          if [[ "$tag" != "$corim_ver" || "$tag" != "$macros_ver" ]]; then
            echo "::error::Tag $tag does not match crate versions" >&2
            exit 1
          fi

      # Pre-flight: full test + clippy on the exact tagged commit, across
      # all optional profiles and JSON support,
      # plus a no-default-features build for the no_std + alloc path.
      - name: Test (workspace, all features)
        run: cargo test --locked --workspace --all-features

      - name: Clippy (workspace, all features)
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Clippy (corim, no-default-features)
        run: cargo clippy --locked -p corim --lib --no-default-features -- -D warnings

      - name: Build (corim, no-default-features, no_std + alloc)
        run: cargo build --locked -p corim --no-default-features

      - name: Package and verify both crates together
        run: |
          set -euo pipefail
          cargo package --workspace --exclude corim-cli --all-features --locked
          version="${GITHUB_REF_NAME#v}"
          mkdir -p target/release-artifacts
          cp "$CARGO_TARGET_DIR/package/corim-macros-$version.crate" target/release-artifacts/
          cp "$CARGO_TARGET_DIR/package/corim-$version.crate" target/release-artifacts/
          (
            cd target/release-artifacts
            sha256sum "corim-macros-$version.crate" "corim-$version.crate" > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      # Complete this upload before obtaining a registry credential. Artifacts
      # from a successful step remain downloadable even if publication fails.
      - name: Retain verified release archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-crates-${{ github.ref_name }}
          path: target/release-artifacts/
          if-no-files-found: error
          retention-days: 90

      # Exchange the GitHub OIDC token for a crates.io publish token.
      # Sets CARGO_REGISTRY_TOKEN in the environment for subsequent steps.
      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth

      - name: Publish corim-macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: bash scripts/publish-crate.sh corim-macros "${GITHUB_REF_NAME#v}" "target/release-artifacts/corim-macros-${GITHUB_REF_NAME#v}.crate"

      - name: Publish corim
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: bash scripts/publish-crate.sh corim "${GITHUB_REF_NAME#v}" "target/release-artifacts/corim-${GITHUB_REF_NAME#v}.crate"
