[package]
name = "corim-macros"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Internal proc-macro derive crate for the corim crate. Provides CborSerialize/CborDeserialize derives for CBOR integer-keyed map encoding."
license = "MIT"
authors = ["Microsoft"]
repository = "https://github.com/Azure/corim"
readme = "README.md"
keywords = ["corim", "cbor", "derive", "proc-macro"]
categories = ["encoding"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
