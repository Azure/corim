[workspace]
members = [
    "corim",
    "corim-macros",
    "corim-cli",
]
resolver = "2"

[workspace.dependencies]
corim-macros = { path = "corim-macros", version = "0.1.3" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = "1"
thiserror = { version = "2", default-features = false }
