# cargo-deny configuration for the corim workspace.
# Run with: `cargo deny check`
#
# The corim library advertises a minimal dependency footprint (serde,
# thiserror, corim-macros, optionally serde_json). This file enforces that
# claim and guards against unreviewed license / advisory drift.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Keep this list tight. New licenses must be reviewed before being added.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Disallow accidental introduction of a second CBOR implementation —
# the corim crate ships its own and must remain dependency-free on this axis.
deny = [
    { name = "ciborium" },
    { name = "ciborium-io" },
    { name = "ciborium-ll" },
    { name = "serde_cbor" },
    { name = "minicbor" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
