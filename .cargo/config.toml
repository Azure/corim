# Convenience aliases for building a fully static `corim-cli` binary.
#
# The musl target links statically by default, producing a binary with
# no dynamic dependencies (verify with `ldd`, which prints
# "statically linked"). This requires the musl target and a musl C
# toolchain:
#
#     rustup target add x86_64-unknown-linux-musl
#     # Debian/Ubuntu: apt-get install musl-tools
#
# Then build with:
#
#     cargo build-static            # x86_64 static release binary
#
# Output: target/x86_64-unknown-linux-musl/release/corim-cli
[alias]
build-static = "build --release -p corim-cli --target x86_64-unknown-linux-musl"

# Force static CRT linkage explicitly for the musl target. musl is
# static by default; this makes the intent explicit and guards against
# environment overrides.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]
