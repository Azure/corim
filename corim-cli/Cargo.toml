[package]
name = "corim-cli"
version = "0.2.0"
edition = "2021"
publish = false
description = "CLI tool for validating and inspecting CoRIM (Concise Reference Integrity Manifest) documents."
license = "MIT"
authors = ["Microsoft"]
repository = "https://github.com/Azure/corim"
keywords = ["corim", "comid", "cbor", "attestation", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "corim-cli"
path = "src/main.rs"

[dependencies]
corim = { path = "../corim", version = "0.2.0", features = ["json"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"

[features]
# CLI ships with all first-party CoRIM profiles enabled by default so
# `--diagnose` labels vendor-defined mval keys by their spec names
# out of the box, and `generate` resolves their mval aliases. Use
# `--no-default-features` to disable.
default = ["intel", "azure", "psa"]
# Register the Intel CoRIM profile (draft-cds-rats-intel-corim-profile)
# in the diagnose registry so `--diagnose` labels Intel tee.* mval keys
# by their spec names instead of "extension key <N>".
intel = ["corim/profile-intel"]
# Register the example Azure profile so `generate` resolves its
# `tcbstatus` mval alias and `--diagnose` labels it.
azure = ["corim/profile-azure"]
# Register the Arm PSA profile so `generate` resolves its `psa-cert-num`
# mval alias and `--diagnose` labels it.
psa = ["corim/profile-psa"]
