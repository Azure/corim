[package]
name = "corim-cli"
version = "0.1.1"
edition = "2021"
publish = false
description = "CLI tool for validating and inspecting CoRIM (Concise Reference Integrity Manifest) documents."
license = "MIT"
authors = ["Microsoft"]
repository = "https://github.com/Azure/corim"
keywords = ["corim", "comid", "cbor", "attestation", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "corim-cli"
path = "src/main.rs"

[[bin]]
name = "corim-gen-sample"
path = "src/gen_sample.rs"

[[bin]]
name = "corim-gen-signed-sample"
path = "src/gen_signed_sample.rs"

[dependencies]
corim = { path = "../corim", version = "0.1.1" }
corim-profile-intel = { path = "../corim-profile-intel", version = "0.1.0", optional = true }
clap = { version = "4", features = ["derive"] }
hex = "0.4"

[features]
default = []
# Register the Intel CoRIM profile (draft-cds-rats-intel-corim-profile)
# in the diagnose registry so `--diagnose` labels Intel tee.* mval keys
# by their spec names instead of "extension key <N>".
intel = ["dep:corim-profile-intel"]
